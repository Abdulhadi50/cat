<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>كومة الفاكهة - Fruit Stack</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--panel:#fff7e6;--ink:#5a2d0c;--gold:#ffc53d;--gold-d:#c98a12;--green:#4cd964;--green-d:#2fa341;--blue-d:#2f7fc4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;font-family:Tahoma,'Segoe UI',sans-serif;background:#2a8fd6;color:var(--ink)}
.app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(#8fdcff,#4fb8f2 55%,#7fcfff)}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.85;pointer-events:none}
.top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.av{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:#ffd166;border:3px solid #fff;display:grid;place-items:center;
  font-weight:900;font-size:20px;color:var(--ink);box-shadow:0 3px 0 var(--gold-d);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who{display:flex;flex-direction:column;min-width:0}
.who b{color:#fff;text-shadow:0 2px 0 #2a6fa8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:#e8f7ff;font-size:11px}
.chips{position:relative;z-index:2;display:flex;gap:6px;padding:6px 10px 14px}
.chip{flex:1;min-width:0;background:#fff3d6;border:3px solid var(--gold-d);border-radius:18px;padding:5px 6px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 var(--gold-d);font-size:14px;position:relative}
.chip b{font-weight:900;white-space:nowrap}
.chip small{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10px;color:#fff;text-shadow:0 1px 0 #2a6fa8;font-weight:800}
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:4px 12px 100px}
.card{background:var(--panel);border:3px solid var(--gold-d);border-radius:24px;padding:14px;margin-bottom:12px;box-shadow:0 5px 0 var(--gold-d)}
.card h2{font-size:20px;margin-bottom:6px;text-align:center}
.btn{width:100%;border:none;border-radius:18px;padding:13px;font-size:17px;font-weight:900;color:var(--ink);font-family:inherit;cursor:pointer;
  background:linear-gradient(#ffe066,var(--gold));box-shadow:0 6px 0 var(--gold-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold-d)}
.btn:disabled{filter:grayscale(.8);opacity:.6;transform:none}
.btn.green{background:linear-gradient(#7ef08a,var(--green));box-shadow:0 6px 0 var(--green-d);color:#fff}
.btn.green:active{box-shadow:0 3px 0 var(--green-d)}
.btn.ghost{background:#fff;box-shadow:0 4px 0 #b9c9d6;color:#2b5d80;font-size:14px;padding:10px}
.btn.ghost:active{box-shadow:0 1px 0 #b9c9d6}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:14px;box-shadow:0 4px 0 var(--gold-d)}
.center{text-align:center}
.big{font-size:40px;letter-spacing:4px;margin:8px 0}
.muted{font-size:13px;line-height:1.7}
.stats{display:flex;justify-content:space-between;font-weight:900;background:#fff3d6;border:3px solid var(--gold-d);border-radius:16px;padding:8px 12px;margin-bottom:8px}
.bar{height:14px;background:#d9efff;border-radius:10px;overflow:hidden;border:2px solid var(--blue-d);margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ef08a,var(--green));transition:width .3s}
.held{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;color:#fff;font-weight:800;text-shadow:0 2px 0 #2a6fa8}
.prev{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#3f9fe0;border:5px solid var(--blue-d);border-radius:18px;padding:6px}
.col{display:flex;flex-direction:column-reverse;gap:5px;background:rgba(255,255,255,.2);border-radius:12px;padding:4px;cursor:pointer;min-width:0}
.col:active{background:rgba(255,255,255,.36)}
.cell{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,5vw,22px)}
.cell.p{border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.15)}
.cell.new{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.nav{position:absolute;z-index:5;left:8px;right:8px;bottom:8px;display:flex;gap:4px;background:#fff3d6;border:3px solid var(--gold-d);border-radius:24px;padding:5px;box-shadow:0 4px 0 var(--gold-d)}
.nav button{flex:1;min-width:0;border:none;background:none;border-radius:16px;padding:6px 1px;font-family:inherit;font-weight:800;font-size:11px;color:#8a5a22;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{background:linear-gradient(#5fd0ff,#2aa6ef);color:#fff;box-shadow:0 3px 0 #1a7fc0}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border:2px solid #f0dcb0;border-radius:16px;margin-bottom:8px}
.row .ic{width:38px;height:38px;border-radius:50%;background:#fff3d6;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px}
.row .tx small{font-size:11px;color:#8a5a22}
.tag{font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff;border:2px solid #f0dcb0;border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}
.stat small{font-size:11px;color:#8a5a22}
.modal{position:absolute;inset:0;z-index:20;background:rgba(20,60,100,.55);display:grid;place-items:center;padding:20px}
.modal-box{background:var(--panel);border:4px solid var(--gold-d);border-radius:26px;padding:20px 16px;width:100%;max-width:330px;text-align:center;box-shadow:0 8px 0 var(--gold-d);animation:pop .3s}
.modal-box .ico{font-size:54px;margin-bottom:6px}
.modal-box h3{font-size:20px;margin-bottom:6px}
.modal-box p{font-size:14px;margin-bottom:14px;line-height:1.8}
.toast{position:absolute;top:12px;left:50%;z-index:30;transform:translate(-50%,-160%);background:#fff3d6;border:3px solid var(--gold-d);border-radius:20px;padding:8px 16px;font-weight:800;font-size:14px;transition:transform .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
.wheelWrap{position:relative;width:270px;height:270px;margin:18px auto 8px}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #ff5d6c;filter:drop-shadow(0 2px 0 #7a1a25)}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 6px 0 var(--gold-d);transition:transform 4.2s cubic-bezier(.17,.67,.2,1)}
.wheel .lbl{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .lbl span{position:absolute;left:-42px;top:0;width:84px;text-align:center;transform:translateY(-112px);font-weight:900;font-size:13px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.hub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,var(--gold));border:4px solid #fff;box-shadow:0 3px 0 var(--gold-d)}
.pack{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pack .amt{font-size:22px;font-weight:900}
</style>
</head>
<body>
<div class="app">
  <div class="cloud" style="width:120px;height:34px;top:90px;left:-30px"></div>
  <div class="cloud" style="width:90px;height:26px;top:200px;right:-20px"></div>

  <header class="top">
    <div class="av" id="avatar">?</div>
    <div class="who"><b id="uname">...</b><small id="uid"></small></div>
  </header>

  <div class="chips">
    <div class="chip"><span>🪙</span><b id="cCoins">0</b></div>
    <div class="chip"><span>💎</span><b id="cGems">0</b></div>
    <div class="chip"><span>⚡</span><b id="cEnergy">0/10</b><small id="cTimer"></small></div>
  </div>

  <main>
    <section id="v-play">
      <div class="card" id="lvlTitle"></div>
      <div class="card center" id="startBox">
        <div class="big">🍓🍋🫐</div>
        <p class="muted" id="lvlDesc"></p>
        <button class="btn" id="startBtn" style="margin-top:10px">ابدأ المرحلة <small>⚡1</small></button>
      </div>
      <div id="gameBox" hidden>
        <div class="stats"><div>النقاط <b id="score">0</b> / <span id="goal">0</span></div><div>الحركات <b id="moves">0</b></div></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="held"><span>القادمة</span><div class="prev" id="held"></div><span style="font-size:12px">اضغط أي عمود</span></div>
        <div class="board" id="board"></div>
        <div class="center" style="margin-top:10px"><button class="btn ghost" id="quitBtn">إنهاء المرحلة</button></div>
      </div>
    </section>

    <section id="v-missions" hidden>
      <div class="card center">
        <h2>الهدية اليومية</h2>
        <p class="muted" id="dailyTxt"></p>
        <button class="btn green" id="dailyBtn" style="margin-top:8px">استلم 100 🪙 + ⚡1</button>
      </div>
      <div id="missionList"></div>
      <div class="card">
        <h2>ادعُ الأصدقاء</h2>
        <p class="muted">شارك رابطك. المكافأة تُحسب على الخادم فقط بعد التحقق من الانضمام.</p>
        <div class="row" style="margin-top:8px"><div class="tx"><small id="refLink" style="direction:ltr;display:block;word-break:break-all"></small></div></div>
        <div class="grid2">
          <button class="btn sm" id="copyRef">نسخ الرابط</button>
          <button class="btn sm green" id="shareRef">مشاركة</button>
        </div>
        <p class="muted center" style="margin-top:8px">الدعوات: <b id="invCount">0</b></p>
      </div>
    </section>

    <section id="v-wheel" hidden>
      <div class="card center">
        <h2>عجلة الحظ</h2>
        <div class="wheelWrap">
          <div class="pointer"></div>
          <div class="wheel" id="wheel"></div>
          <div class="hub" style="display:none"></div>
        </div>
        <p class="muted" id="wheelMsg"></p>
        <button class="btn green" id="spinBtn" style="margin-top:10px">لف العجلة</button>
      </div>
    </section>

    <section id="v-shop" hidden>
      <div class="card">
        <h2>متجر الطاقة</h2>
        <p class="muted center">تُستخدم الطاقة لبدء المراحل.</p>
      </div>
      <div id="packList"></div>
    </section>

    <section id="v-profile" hidden>
      <div class="card center">
        <div class="av" id="pAvatar" style="width:90px;height:90px;margin:0 auto 8px;font-size:36px">?</div>
        <h2 id="pName"></h2>
        <p class="muted" id="pId"></p>
      </div>
      <div class="grid2" id="pStats" style="margin-bottom:12px"></div>
      <div class="card">
        <div class="row"><div class="ic">🔊</div><div class="tx"><b>الأصوات</b></div><button class="btn sm" id="soundBtn"></button></div>
        <div class="row"><div class="ic">🔄</div><div class="tx"><b>إعادة ضبط التقدم</b><small>يحذف تقدمك المحلي</small></div><button class="btn sm ghost" id="resetBtn">إعادة</button></div>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button data-v="play" class="on"><i>🎮</i>العب</button>
    <button data-v="missions"><i>📜</i>المهام</button>
    <button data-v="wheel"><i>🎡</i>العجلة</button>
    <button data-v="shop"><i>🛒</i>المتجر</button>
    <button data-v="profile"><i>👤</i>حسابي</button>
  </nav>

  <div class="modal" id="result" hidden>
    <div class="modal-box">
      <div class="ico" id="resIcon"></div>
      <h3 id="resTitle"></h3>
      <p id="resSub"></p>
      <button class="btn" id="resBtn"></button>
      <button class="btn ghost" id="resBtn2" style="margin-top:8px" hidden></button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
/* ===== الإعدادات ===== */
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); }
// ملاحظة أمنية: هذه البيانات من المتصفح فقط للعرض. يجب التحقق من initData على الخادم.
const USER = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || { id: 'guest', first_name: 'لاعب تجريبي' };
const BOT = 'YOUR_BOT_USERNAME';     // ضع اسم البوت هنا
const APP = 'play';                  // اسم تطبيق الويب في BotFather
const CHANNEL = 'https://t.me/YOUR_CHANNEL';
const COLS = 6, ROWS = 7, MAX_E = 10, REGEN = 10 * 60 * 1000, DAY = 24 * 3600 * 1000, KEY = 'fruitStack.v1';

const FRUITS = [
  { e: '🍓', c: '#ff6b8a' }, { e: '🍋', c: '#ffd93d' }, { e: '🫐', c: '#7c7cff' },
  { e: '🍇', c: '#b070ff' }, { e: '🍊', c: '#ff9f43' }, { e: '🥝', c: '#6bd35f' }
];
const PRIZES = [
  { t: 'coins', v: 50,  l: '50 🪙',  c: '#ff6b8a' },
  { t: 'gems',  v: 2,   l: '2 💎',   c: '#ffd93d' },
  { t: 'coins', v: 150, l: '150 🪙', c: '#7c7cff' },
  { t: 'energy',v: 1,   l: '1 ⚡',   c: '#4cd964' },
  { t: 'coins', v: 300, l: '300 🪙', c: '#ff9f43' },
  { t: 'gems',  v: 5,   l: '5 💎',   c: '#b070ff' },
  { t: 'coins', v: 100, l: '100 🪙', c: '#36c5f0' },
  { t: 'none',  v: 0,   l: 'حظ أوفر', c: '#9aa9b8' }
];
const PACKS = [{ n: 5, p: 300 }, { n: 10, p: 550 }, { n: 25, p: 1200 }];
const MISSIONS = [
  { id: 'play3', t: 'العب 3 مراحل', r: { coins: 150 }, prog: () => S.stats.played, goal: 3 },
  { id: 'won5',  t: 'اربح 5 مراحل', r: { coins: 300, gems: 2 }, prog: () => S.stats.won, goal: 5 },
  { id: 'lvl10', t: 'صل إلى المرحلة 10', r: { gems: 5 }, prog: () => S.level, goal: 10 },
  { id: 'inv3',  t: 'ادعُ 3 أصدقاء', r: { coins: 500 }, prog: () => S.invites, goal: 3 },
  { id: 'chan',  t: 'انضم إلى قناتنا', r: { coins: 200 }, link: CHANNEL }
];

/* ===== الحالة ===== */
const defState = () => ({
  coins: 300, gems: 0, energy: MAX_E, lastRegen: Date.now(), level: 1, stars: {},
  daily: 0, wheel: 0, claimed: {}, opened: {}, stats: { played: 0, won: 0, coinsEarned: 0 },
  invites: 0, sound: true
});
function load() { try { return Object.assign(defState(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return defState(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
let G = null;          // الحالة الحالية للمرحلة
let wheelRot = 0, spinning = false;

/* ===== أدوات ===== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const fmt = n => Number(n || 0).toLocaleString('en-US');
function fmtT(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, '0');
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
}
function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
let AC = null;
function play(f) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + .18);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + .2);
  } catch (e) {}
}

/* ===== الطاقة ===== */
function regen() {
  const now = Date.now();
  if (S.energy >= MAX_E) { S.lastRegen = now; return; }
  const n = Math.floor((now - S.lastRegen) / REGEN);
  if (n > 0) {
    S.energy = Math.min(MAX_E, S.energy + n);
    S.lastRegen += n * REGEN;
    if (S.energy >= MAX_E) S.lastRegen = now;
    save();
  }
}

/* ===== الشاشات ===== */
function show(v) {
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'v-' + v);
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'play') renderPlay();
  if (v === 'missions') renderMissions();
  if (v === 'wheel') renderWheel();
  if (v === 'shop') renderShop();
  if (v === 'profile') renderProfile();
}
function updateTop() {
  $('cCoins').textContent = fmt(S.coins);
  $('cGems').textContent = fmt(S.gems);
  $('cEnergy').textContent = S.energy + '/' + MAX_E;
}

/* ===== المراحل ===== */
function levelCfg(l) {
  return {
    colors: Math.min(3 + Math.floor((l - 1) / 3), 6),
    goal: 150 + l * 90,
    moves: Math.max(14, 24 - Math.floor(l / 2))
  };
}
function renderPlay() {
  const c = levelCfg(S.level);
  $('lvlTitle').innerHTML = `<h2>المرحلة ${S.level}</h2>`;
  $('lvlDesc').innerHTML = `الهدف: <b>${c.goal}</b> نقطة · الحركات: <b>${c.moves}</b><br>
    اجمع 3 فواكه متشابهة متلاصقة لتنفجر. الفواكه الساقطة تُحدث سلاسل إضافية.<br>
    أنواع الفاكهة في هذه المرحلة: <b>${c.colors}</b>`;
}
function startGame() {
  regen();
  if (S.energy < 1) { toast('لا توجد طاقة كافية، افتح المتجر'); show('shop'); return; }
  S.energy--; S.stats.played++; save(); updateTop();
  const cfg = levelCfg(S.level);
  const grid = Array.from({ length: COLS }, () => []);
  for (let c = 0; c < COLS; c++) {
    const n = rnd(0, 3);
    for (let i = 0; i < n; i++) grid[c].push(rnd(0, cfg.colors - 1));
  }
  G = { grid, held: rnd(0, cfg.colors - 1), score: 0, moves: cfg.moves, goal: cfg.goal, colors: cfg.colors, over: false, lastCol: -1 };
  $('startBox').hidden = true; $('gameBox').hidden = false;
  renderGame();
}
function resetGame() {
  G = null; $('gameBox').hidden = true; $('startBox').hidden = false; renderPlay();
}
function findGroups() {
  const seen = new Set(), out = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < G.grid[c].length; r++) {
    const k = c + ',' + r; if (seen.has(k)) continue;
    const v = G.grid[c][r], comp = [], q = [[c, r]];
    seen.add(k);
    while (q.length) {
      const [x, y] = q.pop(); comp.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= G.grid[nx].length) continue;
        const nk = nx + ',' + ny;
        if (seen.has(nk) || G.grid[nx][ny] !== v) continue;
        seen.add(nk); q.push([nx, ny]);
      }
    }
    if (comp.length >= 3) out.push(comp);
  }
  return out;
}
function removeCells(groups) {
  const rm = new Set();
  groups.forEach(g => g.forEach(([c, r]) => rm.add(c + ',' + r)));
  G.grid = G.grid.map((col, c) => col.filter((_, r) => !rm.has(c + ',' + r)));
}
function drop(c) {
  if (!G || G.over) return;
  if (G.grid[c].length >= ROWS) { toast('هذا العمود ممتلئ'); return; }
  G.grid[c].push(G.held);
  G.lastCol = c; G.moves--;
  G.held = rnd(0, G.colors - 1);
  let combo = 0;
  for (;;) {
    const groups = findGroups();
    if (!groups.length) break;
    combo++;
    groups.forEach(g => { G.score += g.length * g.length * 5 * combo; });
    removeCells(groups);
    play(560 + combo * 70);
  }
  if (G.score >= G.goal) return endGame(true);
  if (G.moves <= 0 || G.grid.every(col => col.length >= ROWS)) return endGame(false);
  renderGame();
}
function renderGame() {
  $('score').textContent = G.score;
  $('goal').textContent = G.goal;
  $('moves').textContent = G.moves;
  $('bar').style.width = Math.min(100, G.score / G.goal * 100) + '%';
  $('held').innerHTML = `<div class="prev" style="background:${FRUITS[G.held].c}">${FRUITS[G.held].e}</div>`;
  $('board').innerHTML = G.grid.map((col, c) => {
    let h = '';
    for (let r = 0; r < ROWS; r++) {
      const v = col[r];
      if (v === undefined) h += '<div class="cell"></div>';
      else {
        const isNew = c === G.lastCol && r === col.length - 1;
        h += `<div class="cell p${isNew ? ' new' : ''}" style="background:${FRUITS[v].c}">${FRUITS[v].e}</div>`;
      }
    }
    return `<div class="col" data-c="${c}">${h}</div>`;
  }).join('');
}
function endGame(won) {
  G.over = true;
  if (won) {
    const stars = G.score >= G.goal * 1.5 ? 3 : G.score >= G.goal * 1.2 ? 2 : 1;
    const reward = 40 + S.level * 15;
    S.coins += reward; S.stats.coinsEarned += reward; S.stats.won++;
    S.stars[S.level] = Math.max(S.stars[S.level] || 0, stars);
    let gem = 0;
    if (S.level % 5 === 0) { gem = 5; S.gems += 5; }
    S.level++;
    save(); updateTop(); play(880);
    showResult('🎉', 'أحسنت! فزت بالمرحلة',
      '⭐'.repeat(stars) + '<br>+' + reward + ' 🪙' + (gem ? ' +' + gem + ' 💎' : ''),
      'المرحلة التالية', null, resetGame);
  } else {
    save(); play(200);
    showResult('💫', 'انتهت المرحلة', 'لم تصل إلى الهدف. جرّب مرة أخرى',
      'إعادة المرحلة (⚡1)', 'إنهاء', () => { resetGame(); startGame(); });
  }
}
function showResult(icon, title, sub, p, s, onP) {
  $('resIcon').textContent = icon; $('resTitle').textContent = title; $('resSub').innerHTML = sub;
  $('resBtn').textContent = p;
  $('resBtn').onclick = () => { $('result').hidden = true; if (onP) onP(); };
  const b2 = $('resBtn2');
  if (s) { b2.hidden = false; b2.textContent = s; b2.onclick = () => { $('result').hidden = true; if (G && G.over) resetGame(); }; }
  else b2.hidden = true;
  $('result').hidden = false;
}

/* ===== العجلة ===== */
function buildWheel() {
  const w = $('wheel');
  w.style.background = 'conic-gradient(' + PRIZES.map((p, i) => `${p.c} ${i * 45}deg ${(i + 1) * 45}deg`).join(',') + ')';
  w.innerHTML = PRIZES.map((p, i) => `<div class="lbl" style="transform:rotate(${i * 45 + 22.5}deg)"><span>${p.l}</span></div>`).join('') + '<div class="hub"></div>';
}
const canFreeSpin = () => Date.now() - S.wheel >= DAY;
function renderWheel() {
  const free = canFreeSpin();
  $('spinBtn').disabled = !free || spinning;
  $('wheelMsg').textContent = free ? 'دورانك المجاني جاهز!' : 'الدوران التالي خلال ' + fmtT(DAY - (Date.now() - S.wheel));
}
function spin() {
  if (spinning) return;
  if (!canFreeSpin()) { toast('الدوران المجاني غير متاح الآن'); return; }
  spinning = true; S.wheel = Date.now(); save();
  const idx = rnd(0, PRIZES.length - 1), center = idx * 45 + 22.5;
  wheelRot = wheelRot - (wheelRot % 360) + 360 * 5 + (360 - center);
  $('wheel').style.transform = `rotate(${wheelRot}deg)`;
  play(440); renderWheel();
  setTimeout(() => { spinning = false; applyPrize(PRIZES[idx]); renderWheel(); }, 4300);
}
function applyPrize(p) {
  if (p.t === 'coins') S.coins += p.v;
  if (p.t === 'gems') S.gems += p.v;
  if (p.t === 'energy') S.energy = Math.min(99, S.energy + p.v);
  save(); updateTop(); play(p.t === 'none' ? 200 : 880);
  const sym = p.t === 'coins' ? '🪙' : p.t === 'gems' ? '💎' : '⚡';
  showResult(p.t === 'none' ? '😔' : '🎁', p.t === 'none' ? 'حظ أوفر' : 'ربحت!',
    p.t === 'none' ? 'حاول غداً' : '+' + p.v + ' ' + sym, 'رائع', null, null);
}

/* ===== المهام ===== */
function rewardText(r) { return Object.entries(r).map(([k, v]) => v + (k === 'coins' ? ' 🪙' : ' 💎')).join(' · '); }
function renderMissions() {
  $('dailyTxt').textContent = canDaily() ? 'هديتك جاهزة!' : 'متاحة بعد ' + fmtT(DAY - (Date.now() - S.daily));
  $('dailyBtn').disabled = !canDaily();
  $('missionList').innerHTML = MISSIONS.map(m => {
    const done = !!S.claimed[m.id];
    let action;
    if (m.link) {
      const op = S.opened[m.id];
      if (done) action = '<span class="tag">✓ مستلمة</span>';
      else if (!op) action = `<button class="btn sm" data-open="${m.id}">افتح</button>`;
      else if (Date.now() - op < 5000) action = `<button class="btn sm" disabled>انتظر ${Math.ceil((5000 - (Date.now() - op)) / 1000)} ث</button>`;
      else action = `<button class="btn sm green" data-claim="${m.id}">استلم</button>`;
    } else {
      const prog = Math.min(m.goal, m.prog());
      if (done) action = '<span class="tag">✓ مستلمة</span>';
      else if (prog >= m.goal) action = `<button class="btn sm green" data-claim="${m.id}">استلم</button>`;
      else action = `<span class="tag">${prog}/${m.goal}</span>`;
    }
    return `<div class="row"><div class="ic">${m.link ? '📣' : '🎯'}</div>
      <div class="tx"><b>${m.t}</b><small>${rewardText(m.r)}</small></div>${action}</div>`;
  }).join('');
  $('invCount').textContent = S.invites;
  $('refLink').textContent = refLink();
}
function claim(id) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m || S.claimed[id]) return;
  if (m.link) {
    if (!S.opened[id] || Date.now() - S.opened[id] < 5000) { toast('أكمل الخطوة أولاً'); return; }
  } else if (m.prog() < m.goal) { toast('لم تكتمل المهمة بعد'); return; }
  S.claimed[id] = true;
  S.coins += m.r.coins || 0; S.gems += m.r.gems || 0;
  save(); updateTop(); renderMissions(); toast('🎉 تمت المكافأة');
}
function openMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m || S.opened[id]) return;
  S.opened[id] = Date.now(); save();
  if (TG && TG.openTelegramLink && m.link.includes('t.me')) TG.openTelegramLink(m.link);
  else window.open(m.link, '_blank');
  renderMissions();
}
const canDaily = () => Date.now() - S.daily >= DAY;
function claimDaily() {
  if (!canDaily()) return;
  S.daily = Date.now(); S.coins += 100; S.energy = Math.min(99, S.energy + 1);
  save(); updateTop(); renderMissions(); toast('🎁 تمت إضافة الهدية اليومية');
}
const refLink = () => `https://t.me/${BOT}/${APP}?startapp=ref_${USER.id}`;

/* ===== المتجر ===== */
function renderShop() {
  $('packList').innerHTML = PACKS.map((k, i) => `
    <div class="card pack"><div><div class="amt">⚡ ${k.n}</div><small>طاقة إضافية</small></div>
    <button class="btn sm" data-buy="${i}">${fmt(k.p)} 🪙</button></div>`).join('');
}
function buy(i) {
  const k = PACKS[i];
  if (S.coins < k.p) { toast('رصيد العملات غير كافٍ'); return; }
  if (!confirm(`شراء ${k.n} طاقة مقابل ${fmt(k.p)} 🪙؟`)) return;
  S.coins -= k.p; S.energy = Math.min(99, S.energy + k.n);
  save(); updateTop(); renderShop(); toast('✅ تمت إضافة الطاقة');
}

/* ===== الحساب ===== */
function renderProfile() {
  const name = (USER.first_name || '') + (USER.last_name ? ' ' + USER.last_name : '');
  $('pName').textContent = name; $('pId').textContent = 'ID: ' + USER.id;
  $('soundBtn').textContent = S.sound ? 'مفعّل' : 'متوقف';
  const totalStars = Object.values(S.stars).reduce((a, b) => a + b, 0);
  $('pStats').innerHTML = [
    ['المرحلة', S.level], ['النجوم', totalStars], ['مراحل مكتملة', S.stats.won],
    ['مراحل لعبت', S.stats.played], ['العملات', fmt(S.coins)], ['الجواهر', fmt(S.gems)]
  ].map(([l, v]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');
}

/* ===== التهيئة والمؤقت ===== */
function tick() {
  regen();
  $('cEnergy').textContent = S.energy + '/' + MAX_E;
  const left = S.energy >= MAX_E ? 0 : S.lastRegen + REGEN - Date.now();
  $('cTimer').textContent = left > 0 ? fmtT(left) : '';
  if (!$('v-wheel').hidden) renderWheel();
  if (!$('v-missions').hidden) {
    const pending = Object.keys(S.opened).some(id => !S.claimed[id] && Date.now() - S.opened[id] < 5000);
    if (pending || !canDaily()) renderMissions();
  }
}
function init() {
  buildWheel();
  $('uname').textContent = (USER.first_name || '') + (USER.last_name ? ' ' + USER.last_name : '');
  $('uid').textContent = 'ID: ' + USER.id;
  const av = USER.photo_url ? `<img src="${USER.photo_url}" alt="">` : (USER.first_name || '?').charAt(0);
  $('avatar').innerHTML = av; $('pAvatar').innerHTML = av;
  regen(); updateTop(); renderPlay(); show('play');
  setInterval(tick, 1000); tick();
  window.addEventListener('pagehide', save);
}

/* ===== ربط الأحداث ===== */
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
$('startBtn').addEventListener('click', startGame);
$('quitBtn').addEventListener('click', () => { if (confirm('إنهاء المرحلة الحالية؟')) resetGame(); });
$('board').addEventListener('click', e => { const col = e.target.closest('.col'); if (col) drop(+col.dataset.c); });
$('spinBtn').addEventListener('click', spin);
$('dailyBtn').addEventListener('click', claimDaily);
$('missionList').addEventListener('click', e => {
  const c = e.target.closest('[data-claim]'), o = e.target.closest('[data-open]');
  if (c) claim(c.dataset.claim);
  if (o) openMission(o.dataset.open);
});
$('packList').addEventListener('click', e => { const b = e.target.closest('[data-buy]'); if (b) buy(+b.dataset.buy); });
$('copyRef').addEventListener('click', () => {
  const t = refLink();
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('تم نسخ الرابط'), () => toast('تعذر النسخ'));
});
$('shareRef').addEventListener('click', () => {
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(refLink()) + '&text=' + encodeURIComponent('العب كومة الفاكهة معي!');
  if (TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
});
$('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderProfile(); });
$('resetBtn').addEventListener('click', () => {
  if (!confirm('سيتم حذف التقدم المحلي بالكامل. متابعة؟')) return;
  S = defState(); save(); G = null; updateTop(); resetGame(); show('play');
});
init();
</script>
